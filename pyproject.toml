[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-relay"
version = "0.1.0"
description = "A citation-grounded research assistant with a LangGraph workflow and load-testable model clients."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2.0,<2.0.0",
  "groq>=0.30.0",
  "python-dotenv>=1.0.1",
  "pydantic-settings>=2.7.0",
  "PyMuPDF>=1.25.0",
  "rank-bm25>=0.2.2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
